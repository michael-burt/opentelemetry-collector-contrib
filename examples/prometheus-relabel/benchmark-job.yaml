apiVersion: batch/v1
kind: Job
metadata:
  generateName: prometheus-relabel-bench-
spec:
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark
          image: relabel-collector:dev
          command: ["/relabelbench"]
          args: ["-repeats=3", "-batches=120", "-points=256"]
          env:
            - name: GOMAXPROCS
              value: "2"
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
